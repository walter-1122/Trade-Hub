<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Products — Trade.Hub</title><style>
*{box-sizing:border-box}body{margin:0;background:#06111f;color:#f5f9ff;font-family:Arial,Helvetica,sans-serif}.container{width:min(1120px,92%);margin:auto}header{padding:22px 0;border-bottom:1px solid rgba(255,255,255,.08);background:#06111f;position:sticky;top:0;z-index:5}.nav{display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{color:#fff;text-decoration:none;font-size:22px;font-weight:800;display:flex;gap:10px;align-items:center}.logo-mark{color:#0787ff;font-size:30px}.hub{color:#0787ff}.logo small{display:block;font-size:9px;letter-spacing:2px;color:#8fa5ba;margin-top:3px}.page{padding:70px 0 100px}.eyebrow{text-transform:uppercase;letter-spacing:3px;color:#0787ff;font-size:12px;font-weight:700}.page h1{font-size:48px;margin:12px 0}.page-intro{color:#a9bbcc;max-width:700px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;margin-top:45px}.card{display:block;text-decoration:none;color:#fff;background:#0b2036;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:30px;min-height:210px;transition:.25s}.card:hover{transform:translateY(-5px);border-color:#0787ff;box-shadow:0 15px 35px rgba(0,0,0,.25)}.icon{font-size:44px;margin-bottom:20px}.card h2{margin:0 0 10px;font-size:25px}.card p{margin:0;color:#9db2c6;line-height:1.6}.back{display:inline-block;margin-top:35px;color:#0787ff;text-decoration:none;font-weight:700}@media(max-width:700px){.page{padding:45px 0 70px}.page h1{font-size:36px}.grid{grid-template-columns:1fr}.card{min-height:auto}}
</style><style>.products{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:40px}.product{display:block;text-decoration:none;color:#fff;background:#0b2036;border:1px solid rgba(255,255,255,.08);border-radius:18px;overflow:hidden;transition:.25s}.product:hover{transform:translateY(-5px);border-color:#0787ff}.product img{width:100%;height:250px;object-fit:cover;background:#102a43}.body{padding:20px}.body h3{margin:0 0 10px}.body p{color:#9db2c6;line-height:1.5;margin:0 0 12px}.price{color:#55b4ff;font-weight:800}.empty{margin-top:35px;background:#0b2036;border-radius:18px;padding:30px;color:#a9bbcc}@media(max-width:900px){.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.products{grid-template-columns:1fr}}</style></head><body><header><div class="container nav"><a class="logo" href="index.html"><span class="logo-mark">◎</span><span>TRADE.<span class="hub">HUB</span><small>WHOLESALE • GLOBAL SUPPLY</small></span></a></div></header><main class="page"><div class="container"><a class="back" style="margin-top:0" id="backLink">← Back</a><div class="eyebrow" style="margin-top:35px">Admin Posts</div><h1 id="title">Products</h1><p class="page-intro">All products currently posted in this category are shown below.</p><div id="products" class="products"></div><div id="empty" class="empty" style="display:none">No products have been posted in this category yet.</div></div></main><script>const SUPABASE_URL="https://cgclqejzzlrxkuksqgav.supabase.co";const SUPABASE_KEY="sb_publishable_BI34HY1C7-HR9ZzDrXuabQ_QtTRwbBx";const params=new URLSearchParams(location.search);const category=params.get("category")||"";document.title=(category||"Products")+" — Trade.Hub";document.getElementById("title").textContent=category||"Products";document.getElementById("backLink").href=category?"javascript:history.back()":"index.html#products";async function load(){const box=document.getElementById("products"),empty=document.getElementById("empty");if(!category){empty.textContent="No category was selected.";empty.style.display="block";return}const url=SUPABASE_URL+"/rest/v1/posts?select=id,title,description,image_url,price_per_piece,minimum_quantity,category&category=eq."+encodeURIComponent(category)+"&order=created_at.desc";try{const res=await fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}});if(!res.ok)throw new Error("Unable to load products");const posts=await res.json();if(!posts.length){empty.style.display="block";return}posts.forEach(post=>{const a=document.createElement("a");a.className="product";a.href="product.html?id="+encodeURIComponent(post.id);a.innerHTML='<img src="'+(post.image_url||'')+'" alt="'+esc(post.title||'Product')+'"><div class="body"><h3>'+esc(post.title||'Untitled Product')+'</h3><p>'+esc(post.description||'')+'</p>'+(post.price_per_piece!=null?'<div class="price">'+esc(String(post.price_per_piece))+' per piece</div>':'')+(post.minimum_quantity!=null?'<p>Minimum: '+esc(String(post.minimum_quantity))+'</p>':'')+'</div>';box.appendChild(a)})}catch(e){empty.textContent="Products could not be loaded right now.";empty.style.display="block"}}function esc(v){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}load();</script></body></html>
