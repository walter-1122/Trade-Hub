<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Men's Perfumes | Trade Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #07111f;
      color: #fff;
      min-height: 100vh;
    }

    header {
      background: #09182a;
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 20px 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo { font-size: 25px; font-weight: 700; }
    .logo span { color: #4da3ff; }

    a { color: #4da3ff; text-decoration: none; }
    .back {
      color: white;
      border: 1px solid #315779;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 65px 25px 90px;
    }

    .eyebrow {
      color: #4da3ff;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-size: 12px;
      margin-bottom: 14px;
    }

    h1 { font-size: 42px; margin-bottom: 14px; }
    .intro {
      color: #aebdcd;
      line-height: 1.7;
      max-width: 650px;
      margin-bottom: 35px;
    }

    .notice {
      background: #10243a;
      border: 1px solid rgba(77,163,255,.25);
      border-radius: 12px;
      padding: 22px;
      color: #c5d2df;
      line-height: 1.6;
    }

    footer {
      background: #050d17;
      border-top: 1px solid rgba(255,255,255,.07);
      color: #8191a2;
      text-align: center;
      padding: 24px 15px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header { padding: 17px 5%; }
      .logo { font-size: 21px; }
      .back { padding: 8px 11px; font-size: 12px; }
      h1 { font-size: 34px; }
      main { padding-top: 48px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Trade<span>Hub</span></div>
    <a class="back" href="perfumes.html">← Back to Perfumes</a>
  </header>

  <main>
    <div class="eyebrow">Wholesale Catalogue</div>
    <h1>Men's Perfumes</h1>
    <p class="intro">
      Browse our men's fragrance collection for wholesale buyers.
    </p>

    <div class="notice">
      Men's perfume listings will appear here. Add your product names,
      photos, and wholesale details to display the full collection.
    </div>
  </main>

  <footer>© 2026 Trade Hub. Wholesale Catalogue.</footer>
</body>
</html>
