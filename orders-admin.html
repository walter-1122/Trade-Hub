<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trade-Hub Orders</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#07111f;
    color:white;
}

.container{
    width:95%;
    max-width:1400px;
    margin:30px auto;
}

h1{
    color:#5eb8ff;
}

.login-box,
.dashboard,
.details-box{
    background:#0d1b2d;
    padding:25px;
    border-radius:15px;
    border:1px solid #1c3550;
}

.dashboard,
.details-box{
    display:none;
}

input,
button,
select{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #294766;
    background:#081523;
    color:white;
}

button{
    background:#1683d8;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#0f6db5;
}

.search{
    margin:20px 0;
}

.logout{
    width:auto;
    padding:10px 20px;
    background:#b83232;
    float:right;
}

.back{
    width:auto;
    padding:10px 20px;
    margin-bottom:20px;
}

.orders-list{
    display:grid;
    gap:12px;
}

.order-card{
    background:#10243a;
    border:1px solid #244866;
    border-radius:12px;
    padding:18px;
    cursor:pointer;
}

.order-card:hover{
    background:#15304a;
}

.order-top{
    display:flex;
    justify-content:space-between;
    gap:20px;
}

.order-product{
    font-size:18px;
    font-weight:bold;
    color:#5eb8ff;
}

.order-info{
    color:#b8c9d9;
    margin-top:8px;
}

.status{
    width:auto;
    min-width:140px;
    margin:0;
}

.detail-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.detail-section{
    background:#10243a;
    padding:18px;
    border-radius:12px;
    border:1px solid #244866;
}

.detail-section h3{
    color:#5eb8ff;
    margin-top:0;
}

.detail-row{
    margin:10px 0;
    line-height:1.5;
}

.label{
    color:#91a8bc;
}

.value{
    color:white;
}

.total{
    font-size:22px;
    color:#5eb8ff;
    font-weight:bold;
}

@media(max-width:800px){

    .detail-grid{
        grid-template-columns:1fr;
    }

    .order-top{
        flex-direction:column;
    }

}
</style>
</head>

<body>

<div class="container">

<h1>Trade-Hub Orders</h1>


<!-- LOGIN -->

<div id="loginBox" class="login-box">

<h2>Admin Login</h2>

<input
    type="email"
    id="email"
    placeholder="Admin Email"
>

<input
    type="password"
    id="password"
    placeholder="Password"
>

<button onclick="login()">
Login
</button>

<p id="loginMessage"></p>

</div>


<!-- DASHBOARD -->

<div id="dashboard" class="dashboard">

<button
    class="logout"
    onclick="logout()"
>
Logout
</button>

<h2>Orders</h2>

<input
    class="search"
    id="searchInput"
    placeholder="Search by customer, product, WhatsApp, email, country or order ID..."
    oninput="filterOrders()"
>

<button onclick="loadOrders()">
Refresh Orders
</button>

<div
    id="ordersContainer"
    class="orders-list"
>
Loading orders...
</div>

</div>


<!-- ORDER DETAILS -->

<div id="detailsBox" class="details-box">

<button
    class="back"
    onclick="showDashboard()"
>
← Back to Orders
</button>

<div id="detailsContainer">
Loading...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://cgclqejzzlrxkuksqgav.supabase.co";

const SUPABASE_KEY =
"sb_publishable_BI34HY1C7-HR9ZzDrXuabQ_QtTRwbBx";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let allOrders = [];


// LOGIN

async function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const { error } =
        await supabaseClient.auth.signInWithPassword({
            email:email,
            password:password
        });

    if(error){

        document.getElementById("loginMessage").innerText =
            error.message;

        return;
    }

    document.getElementById("loginBox").style.display =
        "none";

    document.getElementById("dashboard").style.display =
        "block";

    loadOrders();
}


// LOAD ORDERS

async function loadOrders(){

    const { data, error } =
        await supabaseClient
        .from("orders")
        .select("*")
        .order("created_at",{
            ascending:false
        });

    if(error){

        console.error(error);

        document.getElementById("ordersContainer").innerHTML =
            "<p>Unable to load orders.</p>";

        return;
    }

    allOrders = data || [];

    displayOrders(allOrders);
}


// DISPLAY ORDERS

function displayOrders(orders){

    const container =
        document.getElementById("ordersContainer");

    if(!orders.length){

        container.innerHTML =
            "<p>No orders found.</p>";

        return;
    }

    container.innerHTML = "";

    orders.forEach(order => {

        const card =
            document.createElement("div");

        card.className =
            "order-card";

        card.onclick = function(){
            openOrder(order.id);
        };

        card.innerHTML = `

            <div class="order-top">

                <div>

                    <div class="order-product">
                        ${escapeHTML(order.product_name || "Unknown Product")}
                    </div>

                    <div class="order-info">
                        Order #${escapeHTML(String(order.id))}
                    </div>

                    <div class="order-info">
                        Customer:
                        ${escapeHTML(order.customer_name || "")}
                    </div>

                    <div class="order-info">
                        Quantity:
                        ${escapeHTML(String(order.quantity || ""))}
                    </div>

                </div>

                <div>

                    <select
                        class="status"
                        onclick="event.stopPropagation()"
                        onchange="updateStatus(${order.id},this.value)"
                    >

                        <option value="Pending"
                        ${order.status === "Pending" ? "selected" : ""}>
                        Pending
                        </option>

                        <option value="Confirmed"
                        ${order.status === "Confirmed" ? "selected" : ""}>
                        Confirmed
                        </option>

                        <option value="Cancelled"
                        ${order.status === "Cancelled" ? "selected" : ""}>
                        Cancelled
                        </option>

                        <option value="Shipped"
                        ${order.status === "Shipped" ? "selected" : ""}>
                        Shipped
                        </option>

                        <option value="Completed"
                        ${order.status === "Completed" ? "selected" : ""}>
                        Completed
                        </option>

                    </select>

                </div>

            </div>

        `;

        container.appendChild(card);

    });

}


// SEARCH

function filterOrders(){

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const filtered =
        allOrders.filter(order => {

            const text = [

                order.id,
                order.product_name,
                order.customer_name,
                order.whatsapp,
                order.email,
                order.country,
                order.city

            ].join(" ").toLowerCase();

            return text.includes(search);

        });

    displayOrders(filtered);
}


// OPEN ORDER

function openOrder(orderId){

    const order =
        allOrders.find(
            item => String(item.id) === String(orderId)
        );

    if(!order){
        return;
    }

    document.getElementById("dashboard").style.display =
        "none";

    document.getElementById("detailsBox").style.display =
        "block";


    const price =
        Number(order.price_per_piece || 0);

    const quantity =
        Number(order.quantity || 0);

    const shipping =
        Number(order.shipping_cost || 0);

    const calculatedProductsTotal =
        price * quantity;

    const total =
        order.total_amount !== null &&
        order.total_amount !== undefined
        ? Number(order.total_amount)
        : calculatedProductsTotal + shipping;


    document.getElementById("detailsContainer").innerHTML = `

        <h2>Order #${escapeHTML(String(order.id))}</h2>

        <div class="detail-grid">


            <div class="detail-section">

                <h3>Customer Details</h3>

                <div class="detail-row">
                    <span class="label">Name:</span><br>
                    <span class="value">
                    ${escapeHTML(order.customer_name || "")}
                    </span>
                </div>

                <div class="detail-row">
                    <span class="label">WhatsApp:</span><br>
                    <span class="value">
                    ${escapeHTML(order.whatsapp || "")}
                    </span>
                </div>

                <div class="detail-row">
                    <span class="label">Email:</span><br>
                    <span class="value">
                    ${escapeHTML(order.email || "")}
                    </span>
                </div>

                <div class="detail-row">
                    <span class="label">Country:</span><br>
                    <span class="value">
                    ${escapeHTML(order.country || "")}
                    </span>
                </div>

                <div class="detail-row">
                    <span class="label">City:</span><br>
                    <span class="value">
                    ${escapeHTML(order.city || "")}
                    </span>
                </div>

                <div class="detail-row">
                    <span class="label">Address:</span><br>
                    <span class="value">
                    ${escapeHTML(order.address || "")}
                    </span>
                </div>

            </div>


            <div class="detail-section">

                <h3>Order Details</h3>

                <div class="detail-row">
                    <span class="label">Product:</span><br>
                    <span class="value">
                    ${escapeHTML(order.product_name || "")}
                    </span>
                </div>

                <div class="detail-row">
                    <span class="label">Quantity:</span><br>
                    <span class="value">
                    ${escapeHTML(String(order.quantity || ""))}
                    </span>
                </div>

                <div class="detail-row">
                    <span class="label">Price Per Piece:</span><br>
                    <span class="value">
                    $${price.toFixed(2)}
                    </span>
                </div>

                <div class="detail-row">
                    <span class="label">Products Total:</span><br>
                    <span class="value">
                    $${calculatedProductsTotal.toFixed(2)}
                    </span>
                </div>

                <div class="detail-row">
                    <span class="label">Shipping Cost:</span><br>
                    <span class="value">
                    $${shipping.toFixed(2)}
                    </span>
                </div>

                <div class="detail-row">
                    <span class="label">Grand Total:</span><br>
                    <span class="total">
                    $${total.toFixed(2)}
                    </span>
                </div>

            </div>


            <div class="detail-section">

                <h3>Payment</h3>

                <div class="detail-row">
                    <span class="label">Payment Method:</span><br>
                    <span class="value">
                    ${escapeHTML(order.payment_method || "Not provided")}
                    </span>
                </div>

                <div class="detail-row">
                    <span class="label">Payment Status:</span><br>
                    <span class="value">
                    ${escapeHTML(order.payment_status || "Pending")}
                    </span>
                </div>

                <div class="detail-row">
                    <span class="label">Reference:</span><br>
                    <span class="value">
                    ${escapeHTML(order.payment_reference || "Not provided")}
                    </span>
                </div>

                <div class="detail-row">
                    <span class="label">Payment Received:</span><br>
                    <span class="value">
                    ${formatDate(order.payment_received_at)}
                    </span>
                </div>

            </div>


            <div class="detail-section">

                <h3>Shipping</h3>

                <div class="detail-row">
                    <span class="label">Shipping Method:</span><br>
                    <span class="value">
                    ${escapeHTML(order.shipping_method || "Not provided")}
                    </span>
                </div>

                <div class="detail-row">
                    <span class="label">Tracking Number:</span><br>
                    <span class="value">
                    ${escapeHTML(order.tracking_number || "Not provided")}
                    </span>
                </div>

                <div class="detail-row">
                    <span class="label">Shipped:</span><br>
                    <span class="value">
                    ${formatDate(order.shipped_at)}
                    </span>
                </div>

                <div class="detail-row">
                    <span class="label">Delivered:</span><br>
                    <span class="value">
                    ${formatDate(order.delivered_at)}
                    </span>
                </div>

            </div>


            <div class="detail-section">

                <h3>Order Information</h3>

                <div class="detail-row">
                    <span class="label">Status:</span><br>
                    <span class="value">
                    ${escapeHTML(order.status || "Pending")}
                    </span>
                </div>

                <div class="detail-row">
                    <span class="label">Order Source:</span><br>
                    <span class="value">
                    ${escapeHTML(order.order_source || "Website")}
                    </span>
                </div>

                <div class="detail-row">
                    <span class="label">Order Created:</span><br>
                    <span class="value">
                    ${formatDate(order.created_at)}
                    </span>
                </div>

                <div class="detail-row">
                    <span class="label">Customer Message:</span><br>
                    <span class="value">
                    ${escapeHTML(order.message || "No message")}
                    </span>
                </div>

            </div>

        </div>

    `;

}


// BACK TO ORDERS

function showDashboard(){

    document.getElementById("detailsBox").style.display =
        "none";

    document.getElementById("dashboard").style.display =
        "block";

}


// UPDATE STATUS

async function updateStatus(orderId,newStatus){

    const { error } =
        await supabaseClient
        .from("orders")
        .update({
            status:newStatus
        })
        .eq("id",orderId);

    if(error){

        console.error(error);

        alert("Unable to update status.");

        return;
    }

    const order =
        allOrders.find(
            item => String(item.id) === String(orderId)
        );

    if(order){
        order.status = newStatus;
    }

    alert("Order status updated!");

}


// LOGOUT

async function logout(){

    await supabaseClient.auth.signOut();

    location.reload();

}


// DATE FORMAT

function formatDate(date){

    if(!date){
        return "Not received";
    }

    return new Date(date).toLocaleString();

}


// SECURITY

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
