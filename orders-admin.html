<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trade-Hub Orders</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#07111f;
    color:white;
}

.container{
    width:95%;
    max-width:1400px;
    margin:30px auto;
}

h1{
    color:#5eb8ff;
}

.login-box,
.dashboard,
.details-box{
    background:#0d1b2d;
    padding:25px;
    border-radius:15px;
    border:1px solid #1c3550;
}

.dashboard,
.details-box{
    display:none;
}

input,
textarea,
button,
select{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #294766;
    background:#081523;
    color:white;
}

textarea{
    min-height:100px;
    resize:vertical;
}

button{
    background:#1683d8;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#0f6db5;
}

.search{
    margin:20px 0;
}

.logout{
    width:auto;
    padding:10px 20px;
    background:#b83232;
    float:right;
}

.back{
    width:auto;
    padding:10px 20px;
}

.save{
    background:#168f4d;
    font-size:16px;
    margin-top:25px;
}

.save:hover{
    background:#116d3b;
}

.orders-list{
    display:grid;
    gap:12px;
    margin-top:20px;
}

.order-card{
    background:#10243a;
    border:1px solid #244866;
    border-radius:12px;
    padding:18px;
    cursor:pointer;
}

.order-card:hover{
    background:#15304a;
}

.order-top{
    display:flex;
    justify-content:space-between;
    gap:20px;
}

.order-product{
    font-size:18px;
    font-weight:bold;
    color:#5eb8ff;
}

.order-info{
    color:#b8c9d9;
    margin-top:8px;
}

.status-small{
    width:auto;
    min-width:140px;
    margin:0;
}

.detail-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-top:20px;
}

.detail-section{
    background:#10243a;
    padding:18px;
    border-radius:12px;
    border:1px solid #244866;
}

.detail-section h3{
    color:#5eb8ff;
    margin-top:0;
}

.detail-section label{
    display:block;
    margin-top:12px;
    color:#91a8bc;
}

.total{
    font-size:22px;
    color:#5eb8ff;
    font-weight:bold;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
}

@media(max-width:800px){

    .detail-grid{
        grid-template-columns:1fr;
    }

    .order-top{
        flex-direction:column;
    }

}

</style>
</head>

<body>

<div class="container">

<h1>Trade-Hub Orders</h1>


<!-- LOGIN -->

<div id="loginBox" class="login-box">

<h2>Admin Login</h2>

<input
    type="email"
    id="email"
    placeholder="Admin Email"
>

<input
    type="password"
    id="password"
    placeholder="Password"
>

<button onclick="login()">
Login
</button>

<p id="loginMessage"></p>

</div>


<!-- DASHBOARD -->

<div id="dashboard" class="dashboard">

<button
    class="logout"
    onclick="logout()"
>
Logout
</button>

<h2>Orders</h2>

<input
    class="search"
    id="searchInput"
    placeholder="Search customer, product, WhatsApp, email, country or order ID..."
    oninput="filterOrders()"
>

<button onclick="loadOrders()">
Refresh Orders
</button>

<div
    id="ordersContainer"
    class="orders-list"
>
Loading orders...
</div>

</div>


<!-- DETAILS -->

<div id="detailsBox" class="details-box">

<button
    class="back"
    onclick="showDashboard()"
>
← Back to Orders
</button>

<div id="detailsContainer">
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://cgclqejzzlrxkuksqgav.supabase.co";

const SUPABASE_KEY =
"sb_publishable_BI34HY1C7-HR9ZzDrXuabQ_QtTRwbBx";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let allOrders = [];

let currentOrder = null;


// LOGIN

async function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const { error } =
        await supabaseClient.auth.signInWithPassword({

            email:email,
            password:password

        });

    if(error){

        document.getElementById("loginMessage").innerText =
            error.message;

        return;
    }

    document.getElementById("loginBox").style.display =
        "none";

    document.getElementById("dashboard").style.display =
        "block";

    loadOrders();
}


// LOAD ORDERS

async function loadOrders(){

    const { data, error } =
        await supabaseClient
        .from("orders")
        .select("*")
        .order("created_at",{
            ascending:false
        });

    if(error){

        console.error(error);

        document.getElementById("ordersContainer").innerHTML =
            "<p>Unable to load orders.</p>";

        return;
    }

    allOrders = data || [];

    displayOrders(allOrders);
}


// DISPLAY ORDERS

function displayOrders(orders){

    const container =
        document.getElementById("ordersContainer");

    if(!orders.length){

        container.innerHTML =
            "<p>No orders found.</p>";

        return;
    }

    container.innerHTML = "";

    orders.forEach(order => {

        const card =
            document.createElement("div");

        card.className =
            "order-card";

        card.onclick = function(){

            openOrder(order.id);

        };

        card.innerHTML = `

            <div class="order-top">

                <div>

                    <div class="order-product">

                        ${escapeHTML(
                            order.product_name ||
                            "Unknown Product"
                        )}

                    </div>

                    <div class="order-info">

                        Order #${escapeHTML(
                            String(order.id)
                        )}

                    </div>

                    <div class="order-info">

                        Customer:
                        ${escapeHTML(
                            order.customer_name || ""
                        )}

                    </div>

                    <div class="order-info">

                        Quantity:
                        ${escapeHTML(
                            String(order.quantity || "")
                        )}

                    </div>

                </div>

                <div>

                    <select
                        class="status-small"
                        onclick="event.stopPropagation()"
                        onchange="updateStatus(
                            ${order.id},
                            this.value
                        )"
                    >

                        <option value="Pending"
                        ${order.status === "Pending"
                        ? "selected"
                        : ""}>
                            Pending
                        </option>

                        <option value="Confirmed"
                        ${order.status === "Confirmed"
                        ? "selected"
                        : ""}>
                            Confirmed
                        </option>

                        <option value="Cancelled"
                        ${order.status === "Cancelled"
                        ? "selected"
                        : ""}>
                            Cancelled
                        </option>

                        <option value="Shipped"
                        ${order.status === "Shipped"
                        ? "selected"
                        : ""}>
                            Shipped
                        </option>

                        <option value="Completed"
                        ${order.status === "Completed"
                        ? "selected"
                        : ""}>
                            Completed
                        </option>

                    </select>

                </div>

            </div>

        `;

        container.appendChild(card);

    });
}


// SEARCH

function filterOrders(){

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const filtered =
        allOrders.filter(order => {

            const text = [

                order.id,
                order.product_name,
                order.customer_name,
                order.whatsapp,
                order.email,
                order.country,
                order.city

            ].join(" ").toLowerCase();

            return text.includes(search);

        });

    displayOrders(filtered);
}


// OPEN ORDER

function openOrder(orderId){

    const order =
        allOrders.find(
            item =>
            String(item.id) ===
            String(orderId)
        );

    if(!order){
        return;
    }

    currentOrder = order;

    document.getElementById("dashboard").style.display =
        "none";

    document.getElementById("detailsBox").style.display =
        "block";


    document.getElementById("detailsContainer").innerHTML = `

        <h2>
            Edit Order #${escapeHTML(
                String(order.id)
            )}
        </h2>


        <div class="detail-grid">


            <!-- CUSTOMER -->

            <div class="detail-section">

                <h3>Customer Details</h3>

                <label>Name</label>

                <input
                    id="editCustomerName"
                    value="${escapeAttr(
                        order.customer_name || ""
                    )}"
                >


                <label>WhatsApp</label>

                <input
                    id="editWhatsapp"
                    value="${escapeAttr(
                        order.whatsapp || ""
                    )}"
                >


                <label>Email</label>

                <input
                    id="editEmail"
                    value="${escapeAttr(
                        order.email || ""
                    )}"
                >


                <label>Country</label>

                <input
                    id="editCountry"
                    value="${escapeAttr(
                        order.country || ""
                    )}"
                >


                <label>City</label>

                <input
                    id="editCity"
                    value="${escapeAttr(
                        order.city || ""
                    )}"
                >


                <label>Address</label>

                <textarea
                    id="editAddress"
                >${escapeHTML(
                    order.address || ""
                )}</textarea>

            </div>


            <!-- ORDER -->

            <div class="detail-section">

                <h3>Order Details</h3>

                <label>Product</label>

                <input
                    id="editProductName"
                    value="${escapeAttr(
                        order.product_name || ""
                    )}"
                >


                <label>Quantity</label>

                <input
                    type="number"
                    id="editQuantity"
                    value="${escapeAttr(
                        String(order.quantity || "")
                    )}"
                >


                <label>Price Per Piece</label>

                <input
                    type="number"
                    step="0.01"
                    id="editPrice"
                    value="${escapeAttr(
                        order.price_per_piece ?? ""
                    )}"
                >


                <label>Shipping Cost</label>

                <input
                    type="number"
                    step="0.01"
                    id="editShipping"
                    value="${escapeAttr(
                        order.shipping_cost ?? 0
                    )}"
                >


                <label>Total Amount</label>

                <input
                    type="number"
                    step="0.01"
                    id="editTotal"
                    value="${escapeAttr(
                        order.total_amount ?? ""
                    )}"
                >

            </div>


            <!-- PAYMENT -->

            <div class="detail-section">

                <h3>Payment Details</h3>

                <label>Payment Method</label>

                <select id="editPaymentMethod">

                    <option value="">
                        Select Payment Method
                    </option>

                    <option value="Cash"
                    ${order.payment_method === "Cash"
                    ? "selected" : ""}>
                        Cash
                    </option>

                    <option value="Card"
                    ${order.payment_method === "Card"
                    ? "selected" : ""}>
                        Card
                    </option>

                    <option value="JazzCash"
                    ${order.payment_method === "JazzCash"
                    ? "selected" : ""}>
                        JazzCash
                    </option>

                    <option value="EasyPaisa"
                    ${order.payment_method === "EasyPaisa"
                    ? "selected" : ""}>
                        EasyPaisa
                    </option>

                    <option value="Bank Transfer"
                    ${order.payment_method === "Bank Transfer"
                    ? "selected" : ""}>
                        Bank Transfer
                    </option>

                    <option value="PayPal"
                    ${order.payment_method === "PayPal"
                    ? "selected" : ""}>
                        PayPal
                    </option>

                    <option value="Other"
                    ${order.payment_method === "Other"
                    ? "selected" : ""}>
                        Other
                    </option>

                </select>


                <label>Payment Status</label>

                <select id="editPaymentStatus">

                    <option value="Pending"
                    ${order.payment_status === "Pending"
                    ? "selected" : ""}>
                        Pending
                    </option>

                    <option value="Paid"
                    ${order.payment_status === "Paid"
                    ? "selected" : ""}>
                        Paid
                    </option>

                    <option value="Failed"
                    ${order.payment_status === "Failed"
                    ? "selected" : ""}>
                        Failed
                    </option>

                    <option value="Refunded"
                    ${order.payment_status === "Refunded"
                    ? "selected" : ""}>
                        Refunded
                    </option>

                </select>


                <label>Payment Reference</label>

                <input
                    id="editPaymentReference"
                    value="${escapeAttr(
                        order.payment_reference || ""
                    )}"
                >


                <label>Payment Received</label>

                <input
                    type="datetime-local"
                    id="editPaymentReceived"
                    value="${toDateInput(
                        order.payment_received_at
                    )}"
                >

            </div>


            <!-- SHIPPING -->

            <div class="detail-section">

                <h3>Shipping Details</h3>

                <label>Shipping Method</label>

                <input
                    id="editShippingMethod"
                    value="${escapeAttr(
                        order.shipping_method || ""
                    )}"
                    placeholder="UPS, FedEx, DHL..."
                >


                <label>Tracking Number</label>

                <input
                    id="editTracking"
                    value="${escapeAttr(
                        order.tracking_number || ""
                    )}"
                >


                <label>Shipped Date</label>

                <input
                    type="datetime-local"
                    id="editShippedAt"
                    value="${toDateInput(
                        order.shipped_at
                    )}"
                >


                <label>Delivered Date</label>

                <input
                    type="datetime-local"
                    id="editDeliveredAt"
                    value="${toDateInput(
                        order.delivered_at
                    )}"
                >

            </div>


            <!-- STATUS -->

            <div class="detail-section">

                <h3>Order Status</h3>

                <label>Status</label>

                <select id="editStatus">

                    <option value="Pending"
                    ${order.status === "Pending"
                    ? "selected" : ""}>
                        Pending
                    </option>

                    <option value="Confirmed"
                    ${order.status === "Confirmed"
                    ? "selected" : ""}>
                        Confirmed
                    </option>

                    <option value="Cancelled"
                    ${order.status === "Cancelled"
                    ? "selected" : ""}>
                        Cancelled
                    </option>

                    <option value="Shipped"
                    ${order.status === "Shipped"
                    ? "selected" : ""}>
                        Shipped
                    </option>

                    <option value="Completed"
                    ${order.status === "Completed"
                    ? "selected" : ""}>
                        Completed
                    </option>

                </select>


                <label>Order Source</label>

                <input
                    id="editOrderSource"
                    value="${escapeAttr(
                        order.order_source ||
                        "Website"
                    )}"
                >

            </div>


            <!-- NOTES -->

            <div class="detail-section">

                <h3>Notes</h3>

                <label>Customer Message</label>

                <textarea
                    id="editMessage"
                >${escapeHTML(
                    order.message || ""
                )}</textarea>

            </div>

        </div>


        <button
            class="save"
            onclick="saveOrder()"
        >
            💾 Save Changes
        </button>

        <div id="saveMessage"></div>

    `;

}


// SAVE ORDER

async function saveOrder(){

    if(!currentOrder){
        return;
    }

    const quantity =
        Number(
            document.getElementById(
                "editQuantity"
            ).value
        ) || 0;

    const price =
        Number(
            document.getElementById(
                "editPrice"
            ).value
        ) || 0;

    const shipping =
        Number(
            document.getElementById(
                "editShipping"
            ).value
        ) || 0;

    let total =
        document.getElementById(
            "editTotal"
        ).value;

    if(total === ""){

        total =
            (price * quantity) +
            shipping;

    }else{

        total =
            Number(total);

    }

    const updateData = {

        customer_name:
            document.getElementById(
                "editCustomerName"
            ).value.trim(),

        whatsapp:
            document.getElementById(
                "editWhatsapp"
            ).value.trim(),

        email:
            document.getElementById(
                "editEmail"
            ).value.trim(),

        country:
            document.getElementById(
                "editCountry"
            ).value.trim(),

        city:
            document.getElementById(
                "editCity"
            ).value.trim(),

        address:
            document.getElementById(
                "editAddress"
            ).value.trim(),

        product_name:
            document.getElementById(
                "editProductName"
            ).value.trim(),

        quantity:
            quantity,

        price_per_piece:
            price,

        shipping_cost:
            shipping,

        total_amount:
            total,

        payment_method:
            document.getElementById(
                "editPaymentMethod"
            ).value,

        payment_status:
            document.getElementById(
                "editPaymentStatus"
            ).value,

        payment_reference:
            document.getElementById(
                "editPaymentReference"
            ).value.trim(),

        payment_received_at:
            dateOrNull(
                document.getElementById(
                    "editPaymentReceived"
                ).value
            ),

        shipping_method:
            document.getElementById(
                "editShippingMethod"
            ).value.trim(),

        tracking_number:
            document.getElementById(
                "editTracking"
            ).value.trim(),

        shipped_at:
            dateOrNull(
                document.getElementById(
                    "editShippedAt"
                ).value
            ),

        delivered_at:
            dateOrNull(
                document.getElementById(
                    "editDeliveredAt"
                ).value
            ),

        status:
            document.getElementById(
                "editStatus"
            ).value,

        order_source:
            document.getElementById(
                "editOrderSource"
            ).value.trim(),

        message:
            document.getElementById(
                "editMessage"
            ).value.trim()

    };


    /*
        IMPORTANT FIX:

        We do NOT use:
        .select()
        .single()

        after update.

        Supabase can return an empty response for UPDATE,
        which was causing:

        "Cannot coerce the result to a single JSON object"
    */

    const { error } =
        await supabaseClient
        .from("orders")
        .update(updateData)
        .eq("id", currentOrder.id);


    if(error){

        console.error(error);

        document.getElementById(
            "saveMessage"
        ).innerHTML = `

            <div class="message">
                ❌ Unable to save changes.
                <br>
                ${escapeHTML(error.message)}
            </div>

        `;

        return;
    }


    /*
        Update the current order locally
        because we no longer receive
        the updated row from .select().single()
    */

    Object.assign(
        currentOrder,
        updateData
    );


    const index =
        allOrders.findIndex(
            item =>
            String(item.id) ===
            String(currentOrder.id)
        );


    if(index !== -1){

        allOrders[index] =
            currentOrder;

    }


    document.getElementById(
        "saveMessage"
    ).innerHTML = `

        <div class="message">
            ✅ Order updated successfully!
        </div>

    `;

}


// STATUS QUICK UPDATE

async function updateStatus(
    orderId,
    newStatus
){

    const { error } =
        await supabaseClient
        .from("orders")
        .update({
            status:newStatus
        })
        .eq("id",orderId);


    if(error){

        console.error(error);

        alert(
            "Unable to update status."
        );

        return;
    }


    const order =
        allOrders.find(
            item =>
            String(item.id) ===
            String(orderId)
        );


    if(order){

        order.status =
            newStatus;

    }


    alert(
        "Order status updated!"
    );

}


// BACK

function showDashboard(){

    document.getElementById(
        "detailsBox"
    ).style.display =
        "none";

    document.getElementById(
        "dashboard"
    ).style.display =
        "block";

    loadOrders();

}


// LOGOUT

async function logout(){

    await supabaseClient.auth.signOut();

    location.reload();

}


// DATE INPUT

function toDateInput(date){

    if(!date){
        return "";
    }

    const d =
        new Date(date);

    if(isNaN(d.getTime())){
        return "";
    }

    const offset =
        d.getTimezoneOffset();

    const local =
        new Date(
            d.getTime() -
            offset * 60000
        );

    return local
        .toISOString()
        .slice(0,16);

}


// DATE SAVE

function dateOrNull(value){

    if(!value){
        return null;
    }

    return new Date(value).toISOString();

}


// SECURITY

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttr(value){

    return escapeHTML(value);

}

</script>

</body>
</html>
