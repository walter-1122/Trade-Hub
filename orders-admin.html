<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trade-Hub Orders</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#07111f;
    color:white;
}

.container{
    width:95%;
    max-width:1400px;
    margin:40px auto;
}

h1{
    color:#5eb8ff;
}

.login-box,
.dashboard{
    background:#0d1b2d;
    padding:25px;
    border-radius:15px;
    border:1px solid #1c3550;
}

input,
button,
select{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #294766;
    background:#081523;
    color:white;
}

button{
    background:#1683d8;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#0f6db5;
}

.dashboard{
    display:none;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:25px;
}

th,
td{
    padding:14px;
    border-bottom:1px solid #243b53;
    text-align:left;
    vertical-align:top;
}

th{
    color:#5eb8ff;
}

.status{
    min-width:140px;
}

.logout{
    width:auto;
    padding:10px 20px;
    background:#b83232;
    float:right;
}

.logout:hover{
    background:#922727;
}

@media(max-width:900px){

    table{
        display:block;
        overflow-x:auto;
        white-space:nowrap;
    }

}
</style>
</head>

<body>

<div class="container">

<h1>Trade-Hub Orders</h1>

<!-- LOGIN -->

<div id="loginBox" class="login-box">

<h2>Admin Login</h2>

<input
    type="email"
    id="email"
    placeholder="Admin Email"
>

<input
    type="password"
    id="password"
    placeholder="Password"
>

<button onclick="login()">
Login
</button>

<p id="loginMessage"></p>

</div>


<!-- DASHBOARD -->

<div id="dashboard" class="dashboard">

<button
    class="logout"
    onclick="logout()"
>
Logout
</button>

<h2>Orders</h2>

<button onclick="loadOrders()">
Refresh Orders
</button>

<div id="ordersContainer">
Loading orders...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://cgclqejzzlrxkuksqgav.supabase.co";

const SUPABASE_KEY =
"sb_publishable_BI34HY1C7-HR9ZzDrXuabQ_QtTRwbBx";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// LOGIN

async function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if(error){

        document.getElementById("loginMessage").innerText =
            error.message;

        return;
    }

    document.getElementById("loginBox").style.display =
        "none";

    document.getElementById("dashboard").style.display =
        "block";

    loadOrders();

}


// LOAD ORDERS

async function loadOrders(){

    const { data, error } =
        await supabaseClient
        .from("orders")
        .select("*")
        .order("created_at", {
            ascending:false
        });

    if(error){

        console.error(error);

        document.getElementById("ordersContainer").innerHTML =
            "<p>Unable to load orders.</p>";

        return;
    }


    if(!data || data.length === 0){

        document.getElementById("ordersContainer").innerHTML =
            "<p>No orders found.</p>";

        return;
    }


    let html = `

    <table>

    <thead>

    <tr>

        <th>Product</th>

        <th>Customer</th>

        <th>Location</th>

        <th>Contact</th>

        <th>Quantity</th>

        <th>Address</th>

        <th>Message</th>

        <th>Date</th>

        <th>Status</th>

    </tr>

    </thead>

    <tbody>

    `;


    data.forEach(order => {

        html += `

        <tr>

            <td>
                <strong>${escapeHTML(order.product_name || "")}</strong>
            </td>

            <td>
                ${escapeHTML(order.customer_name || "")}
            </td>

            <td>
                ${escapeHTML(order.country || "")}<br>
                ${escapeHTML(order.city || "")}
            </td>

            <td>

                WhatsApp:<br>
                ${escapeHTML(order.whatsapp || "")}

                <br><br>

                Email:<br>
                ${escapeHTML(order.email || "")}

            </td>

            <td>
                ${escapeHTML(String(order.quantity || ""))}
            </td>

            <td>
                ${escapeHTML(order.address || "")}
            </td>

            <td>
                ${escapeHTML(order.message || "")}
            </td>

            <td>
                ${new Date(order.created_at).toLocaleString()}
            </td>

            <td>

                <select
                    class="status"
                    onchange="updateStatus(${order.id}, this.value)"
                >

                    <option value="Pending"
                        ${order.status === "Pending" ? "selected" : ""}>
                        Pending
                    </option>

                    <option value="Confirmed"
                        ${order.status === "Confirmed" ? "selected" : ""}>
                        Confirmed
                    </option>

                    <option value="Cancelled"
                        ${order.status === "Cancelled" ? "selected" : ""}>
                        Cancelled
                    </option>

                    <option value="Shipped"
                        ${order.status === "Shipped" ? "selected" : ""}>
                        Shipped
                    </option>

                    <option value="Completed"
                        ${order.status === "Completed" ? "selected" : ""}>
                        Completed
                    </option>

                </select>

            </td>

        </tr>

        `;

    });


    html += `

    </tbody>

    </table>

    `;


    document.getElementById("ordersContainer").innerHTML =
        html;

}


// UPDATE STATUS

async function updateStatus(orderId, newStatus){

    const { error } =
        await supabaseClient
        .from("orders")
        .update({
            status:newStatus
        })
        .eq("id",orderId);

    if(error){

        console.error(error);

        alert("Unable to update order status.");

        return;
    }

    alert("Order status updated!");

}


// LOGOUT

async function logout(){

    await supabaseClient.auth.signOut();

    location.reload();

}


// HTML SECURITY

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
