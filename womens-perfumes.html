<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Women's Perfumes | Trade Hub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #07111f;
            color: #ffffff;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background: #09182a;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 20px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .logo-image {
            width: 42px;
            height: 42px;
            object-fit: contain;
            margin-right: 10px;
        }

        .logo {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .logo span {
            color: #4da3ff;
        }

        .back-btn {
            color: #ffffff;
            text-decoration: none;
            border: 1px solid #315779;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s ease;
        }

        .back-btn:hover {
            background: #12304d;
            border-color: #4da3ff;
        }

        main {
            max-width: 1150px;
            margin: 0 auto;
            padding: 65px 25px 90px;
        }

        .small-title {
            color: #4da3ff;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 44px;
            margin-bottom: 18px;
        }

        .intro {
            color: #b8c6d5;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 38px;
            max-width: 700px;
        }

        /* PRODUCTS */

        .products-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .product-card {
            background: #10243a;
            border: 1px solid rgba(77,163,255,0.18);
            border-radius: 14px;
            overflow: hidden;
            transition: 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-6px);
            border-color: #4da3ff;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
        }

        .product-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
            background: #08192b;
        }

        .product-content {
            padding: 20px;
        }

        .product-category {
            color: #4da3ff;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 9px;
        }

        .product-title {
            font-size: 21px;
            margin-bottom: 10px;
        }

        .product-description {
            color: #b8c6d5;
            font-size: 14px;
            line-height: 1.6;
        }

        /* STATES */

        .state-box {
            background: #10243a;
            border: 1px solid #315779;
            border-radius: 14px;
            padding: 30px 22px;
            color: #d9e5f0;
            font-size: 15px;
            line-height: 1.6;
        }

        .error-box {
            border-color: rgba(255,80,80,0.35);
            color: #ffb5b5;
        }

        footer {
            background: #050d17;
            border-top: 1px solid rgba(255,255,255,0.07);
            text-align: center;
            padding: 25px 20px;
            color: #8191a2;
            font-size: 13px;
        }

        @media (max-width: 850px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {

            header {
                padding: 18px 5%;
            }

            .logo-image {
                width: 36px;
                height: 36px;
            }

            .logo {
                font-size: 21px;
            }

            .back-btn {
                padding: 8px 11px;
                font-size: 12px;
            }

            main {
                padding: 50px 20px 70px;
            }

            h1 {
                font-size: 35px;
            }

            .intro {
                font-size: 14px;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }

            .product-image {
                height: 300px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="header-left">
        <img src="tradehub-logo.png" alt="Trade-Hub Logo" class="logo-image">

        <div class="logo">
            Trade<span>Hub</span>
        </div>
    </div>

    <a href="perfumes.html" class="back-btn">
        ← Back to Perfumes
    </a>

</header>


<main>

    <div class="small-title">
        Wholesale Catalogue
    </div>

    <h1>
        Women's Perfumes
    </h1>

    <p class="intro">
        Browse our women's fragrance collection for wholesale buyers.
    </p>


    <div id="products-container">

        <div class="state-box">
            Loading women's perfumes...
        </div>

    </div>

</main>


<footer>
    © 2026 Trade Hub. Wholesale Catalogue.
</footer>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://cgclqejzzlrxkuksqgav.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_BI34HY1C7-HR9ZzDrXuabQ_QtTRwbBx";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const productsContainer =
    document.getElementById("products-container");


function escapeHTML(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


async function loadWomensPerfumes() {

    const { data, error } = await supabaseClient
        .from("posts")
        .select("*")
        .eq("category", "Women's Perfumes")
        .order("created_at", {
            ascending: false
        });


    if (error) {

        console.error(error);

        productsContainer.innerHTML = `
            <div class="state-box error-box">
                Unable to load women's perfumes right now.
            </div>
        `;

        return;
    }


    if (!data || data.length === 0) {

        productsContainer.innerHTML = `
            <div class="state-box">
                No women's perfume products have been added yet.
            </div>
        `;

        return;
    }


    productsContainer.innerHTML = `

        <div class="products-grid">

            ${data.map(post => `

                <article class="product-card">

                    ${
                        post.image_url
                        ? `
                            <img
                                src="${escapeHTML(post.image_url)}"
                                alt="${escapeHTML(post.title)}"
                                class="product-image"
                                loading="lazy"
                            >
                          `
                        : `
                            <div class="product-image"></div>
                          `
                    }

                    <div class="product-content">

                        <div class="product-category">
                            ${escapeHTML(post.category)}
                        </div>

                        <h2 class="product-title">
                            ${escapeHTML(post.title)}
                        </h2>

                        <p class="product-description">
                            ${escapeHTML(post.description)}
                        </p>

                    </div>

                </article>

            `).join("")}

        </div>

    `;

}


loadWomen'sPerfumes();

</script>

</body>
</html>
</html>
